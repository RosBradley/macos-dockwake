# Builds macos-dockwake.app on a GitHub Mac and publishes it as a Release.
#
# Publish a version:  git tag v1.0.0 && git push origin v1.0.0
# Test a build only:  Actions tab > Release > Run workflow
#                     (the files appear under the run's Artifacts; nothing is published)

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show tools
        run: |
          sw_vers
          xcrun swiftc --version

      - name: Build app
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="0.0.0-test.${GITHUB_RUN_NUMBER}"
          fi
          scripts/build-app.sh

      - name: Keep the files from a test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dockwake-test-build
          path: |
            build/*.dmg
            build/*.zip

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/*.dmg build/*.zip \
            --title "macos-dockwake ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
